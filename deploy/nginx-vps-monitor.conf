# Reverse proxy for vps-monitor.
# Copy to /etc/nginx/sites-available/vps-monitor, edit the domain, then:
#   sudo ln -s /etc/nginx/sites-available/vps-monitor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get TLS with: sudo certbot --nginx -d monitor.example.com
# (certbot will rewrite this file to add the 443 server block + redirect)

server {
    listen 80;
    server_name monitor.example.com;

    # Optional but recommended extra layer: restrict by IP.
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
